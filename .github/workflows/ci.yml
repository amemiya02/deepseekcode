name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache: true

      - name: download deps
        run: go mod download

      - name: vet
        run: go vet $(go list ./... | grep -v /desktop)

      - name: build
        run: go build $(go list ./... | grep -v /desktop)

      - name: test
        run: go test $(go list ./... | grep -v /desktop) -count=1

  cross-build:
    name: cross-compile binaries
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache: true
      - name: build all platforms
        run: |
          set -e
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -o /tmp/dsc-${target%/*}-${target#*/} ./cmd/dsc
            echo "built $target → $(stat -c%s /tmp/dsc-${target%/*}-${target#*/}) bytes"
          done
