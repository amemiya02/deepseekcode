id: reasonix-current
command: reasonix
# `reasonix run <task>` is the headless one-shot mode (the interactive
# `code`/`chat` subcommands would hang a benchmark). The task prompt is
# appended as the trailing positional arg by the prompt_arg input mode.
args:
  - run
input_mode: prompt_arg
env:
  # Reasonix is DeepSeek-native and reads the same DeepSeek API key.
  DEEPSEEK_API_KEY: required
trace_path: bench/traces/reasonix-current/
usage_parser: reasonix
# Reasonix is an external agent. It does NOT emit deepseekcode's epoch/usage
# JSONL trace, so its Cache Reliability gate row will read "trace missing"
# (report-only — it never affects the CI exit code). Its cost is parsed
# best-effort from the `run` summary line (`cache:..% cost:$..`); see
# parseUsageReasonix. A token-level cache comparison would require parsing
# Reasonix's own `--transcript` JSONL, which is tracked as future work.
enforce_cache_gate: false
