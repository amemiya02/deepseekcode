id: ctx-compaction
fixture_repo: fixtures/ctx-compaction
commit: "HEAD"
prompt_file: prompts/ctx-compaction.md
timeout_seconds: 900
# Prompt is analysis-only ("No file modifications"). Enforce that by
# disabling write/edit/bash via --read-only AND auditing afterward
# that the workdir matches HEAD byte-for-byte. The prior
# `no_changes_outside: [.]` allowed every modification — a no-op.
read_only: true
success:
  tests:
    - go test ./...
  diff_invariants:
    - no_changes: true
metrics:
  require_cache_gate: true
  # This task's whole point is compaction. The gate must SEE a compaction
  # record (with before/after prefix hashes) — otherwise "Compaction ✅" would
  # be passing on the absence of evidence. Both the semantic and deterministic
  # paths emit a measurable record, so a run that genuinely compacts produces
  # one; a run that never crossed the threshold fails closed here.
  require_compaction_record: true
