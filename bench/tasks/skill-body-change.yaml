id: skill-body-change
fixture_repo: fixtures/skill-body-change
commit: "HEAD"
prompt_file: prompts/skill-body-change.md
timeout_seconds: 300
success:
  tests:
    - test -f SKILL.md
    - "grep -Eq '^### `analyze`$' SKILL.md"
    - "grep -q -- '--verbose' SKILL.md"
    - "grep -Eiq 'file.?path|path.*input|input.*path' SKILL.md"
    - "grep -Eiq 'JSON.*analysis|analysis.*JSON|analysis report' SKILL.md"
  diff_invariants:
    - no_changes_outside:
        - SKILL.md
metrics:
  require_cache_gate: false
