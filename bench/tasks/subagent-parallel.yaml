id: subagent-parallel
fixture_repo: fixtures/subagent-parallel
commit: "HEAD"
prompt_file: prompts/subagent-parallel.md
timeout_seconds: 600
# Prompt asks for analysis using subagents/parallel processing.
# read_only is intentionally OFF — SubagentTool.IsReadOnly() returns
# false, so --read-only would block the very capability this task tests.
# Post-run audit via no_changes: true catches any unintended writes.
success:
  tests: []
  diff_invariants:
    - no_changes: true
metrics:
  require_cache_gate: true
  # This task's whole point is parent/subagent cache isolation. Subagents run
  # in-process via LoopSpawner and tee their own epoch/usage events into the
  # parent's trace (agent_role="subagent", parent_epoch_id=<parent>, distinct
  # child epoch_id). The gate evaluates the pollution dimension from those real
  # child epochs and passes only when the child did not reuse the parent epoch;
  # if the run produced no child epoch at all it still FAILS closed (N/A, never
  # a hardcoded ✅) rather than fake a pass.
  require_subagent_isolation: true
