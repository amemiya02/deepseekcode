id: subagent-parallel
fixture_repo: fixtures/subagent-parallel
commit: "HEAD"
prompt_file: prompts/subagent-parallel.md
timeout_seconds: 600
# Prompt asks for analysis using subagents/parallel processing.
# read_only is intentionally OFF — SubagentTool.IsReadOnly() returns
# false, so --read-only would block the very capability this task tests.
# Post-run audit via no_changes: true catches any unintended writes.
success:
  tests: []
  diff_invariants:
    - no_changes: true
metrics:
  require_cache_gate: true
  # This task's whole point is parent/subagent cache isolation. The gate
  # must FAIL closed unless the trace actually contains a child (subagent)
  # epoch to judge — no hardcoded ✅. Until cross-process child-trace
  # emission is wired, this task reports the pollution dimension as N/A and
  # fails the gate rather than fake a pass.
  require_subagent_isolation: true
